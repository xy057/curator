# Builds the macOS and Windows apps and publishes them as one GitHub release.
#
# Runs only when started by hand: GitHub ▸ Actions ▸ Release ▸ Run workflow
# (or `gh workflow run release.yml`). Nothing runs on push.
#
# The version is app/pubspec.yaml's (`version: 0.1.1+2` → tag v0.1.1). To release again, bump it
# there and in app/lib/updater.dart (`appVersion`, `appBuild`; `make versions` checks they agree,
# and so does this) and run this again.
# A version that is already released stops the run before anything is built.
#
# A pre-release (the "Pre-release" box) is versioned as any other (0.9.1): only GitHub's mark on
# the release says it is one. The app offers it to those who chose Settings ▸ About ▸ Update
# channel ▸ Pre-release, and to nobody else. Unticking "Set as a pre-release" on the release's
# page makes it the release, for everyone, without building again.
#
# The description is what "What's new" was given: the changelog, as Markdown. The app shows it
# in its update window, up to the `<!-- install -->` line this adds under it (how to install
# follows, for GitHub's readers). The form's field keeps one line, so for a changelog of several:
#   gh workflow run release.yml -f notes="$(pbpaste)"        (add -f prerelease=true for one)
# or tick "Draft" and paste it on the release's page, above `<!-- install -->`, before
# publishing. Left empty, the description is GitHub's own list of what changed.
#
# Both systems build side by side; the release is published only when both have built (and
# Windows has run the smoke test), so a release always has both downloads.
#
# Every action is pinned to a commit (its tag in a comment): a tag can be moved, a commit can't.
# To update one, look up the new tag's commit (`git ls-remote --tags https://github.com/<action>`). The app's updater finds its own by the name:
# Curator-<version>-<macos|windows>.zip.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new: the changelog, as Markdown (empty: GitHub's list of changes)"
        type: string
        default: ''
      prerelease:
        description: Pre-release (offered only on the app's Pre-release channel)
        type: boolean
        default: false
      draft:
        description: Draft (only you see it, and can edit its description, until you publish it on GitHub)
        type: boolean
        default: false

permissions:
  contents: read # only the release job writes (see there)

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the app says the same version
        run: make versions

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          [ -n "$version" ] || { echo "::error::No version in app/pubspec.yaml"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump the version in app/pubspec.yaml first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Compiling Verovio is most of the build. ccache keeps its objects between runs, in its
      # default directory: the build hook doesn't pass CCACHE_DIR through, so don't move it.
      - name: Install ccache
        run: |
          brew install ccache
          ccache --max-size=500M

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          # A cache can't be overwritten, so each run saves its own; the newest one is restored.
          key: ccache-macos-15-${{ github.run_id }}
          restore-keys: ccache-macos-15-

      - name: Build
        # Fetches and patches Verovio, then `flutter build macos --release`. Xcode has once failed
        # a first build with "could not build module 'flutter_soloud'" and passed on the next,
        # so a failed build is tried once more (it is incremental).
        run: make build || make build

      - name: Package
        run: |
          app=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          # ditto keeps the bundle's symlinks, permissions and signature intact (zip -r doesn't).
          ditto -c -k --sequesterRsrc --keepParent "$app" "Curator-${{ needs.version.outputs.version }}-macos.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: Curator-*-macos.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash # Git Bash: the same commands as on macOS
    steps:
      # Keep LF endings: patches/*.patch must apply to Verovio's sources byte for byte.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch and patch Verovio
        # What `make setup` does (no make on Windows): the tag pinned in the Makefile, every patch,
        # then the stamp the build hook checks for.
        run: |
          tag=$(sed -n 's/^VEROVIO_TAG := *//p' Makefile)
          dir=packages/score_engine/third_party/verovio
          git clone --depth 1 --branch "$tag" https://github.com/rism-digital/verovio.git "$dir"
          for p in patches/*.patch; do echo "applying $p"; git -C "$dir" apply "$PWD/$p"; done
          touch "$dir/.curated-score-patched"

      - name: Web player
        # What `make web-player` does (no make on Windows): File ▸ Export to Web… copies it.
        working-directory: app
        run: |
          flutter build web -t lib/web_player/main.dart --release --no-web-resources-cdn --no-wasm-dry-run -o build/web_player --dart-define=CURATOR_COMMIT=$(git rev-parse --short HEAD)
          dart tool/pack_web_player.dart

      - name: Build
        # The build hook runs CMake with Visual Studio for the engine (Verovio) as it goes.
        working-directory: app
        run: flutter build windows --release --dart-define=CURATOR_COMMIT=$(git rev-parse --short HEAD)

      # The app is run once: the sample opens, engraves and draws (integration_test/app_smoke_test.dart; a debug build, so the engine is built again).
      - name: Smoke test
        working-directory: app
        run: flutter test integration_test -d windows

      - name: Package
        shell: pwsh
        run: |
          $out = "Curator"
          Copy-Item -Recurse app/build/windows/x64/runner/Release $out
          # Flutter apps need the Visual C++ runtime; ship it beside the .exe so a fresh
          # Windows doesn't have to install it first.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" $out
          }
          Compress-Archive -Path $out -DestinationPath "Curator-${{ needs.version.outputs.version }}-windows.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: Curator-*-windows.zip
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true # both zips side by side

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          # Read from the environment, never written into the script: what is pasted is text,
          # whatever it says.
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # What's new: as pasted, else GitHub's list of what changed since the last release.
          if [ -n "${NOTES//[[:space:]]/}" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body > notes.md
          fi
          # The app's update window shows the description up to this line (Release.installMarker
          # in app/lib/updater.dart): keep it as it is.
          cat >> notes.md <<'EOF'

          <!-- install -->
          ## Install

          **macOS:** unzip and move the app to Applications. The app isn't notarized by Apple, so
          the first time macOS refuses to open it: open **System Settings ▸ Privacy & Security**
          and click **Open Anyway**, or run once in Terminal:
          `xattr -dr com.apple.quarantine /Applications/Curator.app`

          **Windows:** unzip and run `Curator\curator.exe`. The app isn't signed, so SmartScreen
          may warn the first time: click **More info ▸ Run anyway**.

          Later updates can be downloaded from inside the app: **Settings ▸ About**.
          Find full changelog at: https://0x57.cc/xylabs-changelog#curator
          EOF
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = true ]; then flags+=(--draft); fi
          gh release create "v$VERSION" Curator-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Curator $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
