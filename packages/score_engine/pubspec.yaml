name: score_engine
description: "Engraving and rendering engine for Curator: Verovio + SMuFL, scroll mapping, tile-cached staves."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  archive: ^4.0.0
  code_assets: ^2.1.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/verovio/
    - assets/verovio/text/
  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
    # Bravura's companion text font (SIL OFL 1.1, see assets/fonts/Academico-OFL.txt).
    - family: Academico
      fonts:
        - asset: assets/fonts/Academico-Regular.otf
        - asset: assets/fonts/Academico-Italic.otf
          style: italic
        - asset: assets/fonts/Academico-Bold.otf
          weight: 700
        - asset: assets/fonts/Academico-BoldItalic.otf
          weight: 700
          style: italic
