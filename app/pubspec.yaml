name: curated_score
description: "Curator: animated score videos, curated instrument by instrument."
publish_to: 'none'
version: 0.7.0+162

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Material's own text (menus, the licence page) in the interface's language
    sdk: flutter
  score_engine:
    path: ../packages/score_engine
  archive: ^4.5.0 # .ccs projects are zip archives
  desktop_drop: ^0.8.4 # drop a project, score or recording on the window
  file_selector: ^1.1.0 # Open…, Save As…, Add Recording…
  flutter_soloud: ^5.2.1 # playback; its position is the master clock
  ffi: ^2.2.0 # a buffer of our own to read a recording's samples into (Align)
  web: ^1.1.0 # the web player (lib/web_player/): fetching the page's files, its <audio>
  shared_preferences: ^2.5.6 # Settings and Open Recent
  flutter_svg: ^2.3.0
  vector_graphics_compiler: ^1.1.0 # what an SVG with no size of its own draws (Attach Image)
  pasteboard: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test: # the smoke test of the built app (integration_test/, `make smoke`)
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/ # the sample project behind "Try the sample" (and every test)
    - assets/web_player/ # the web player File ▸ Export to Web… copies (made by `make web-player`, not in git)
    - assets/icon/ # the app icon, at the top of Settings ▸ About (a copy of the macOS one), and the mascot a click on it shows (on the same tile)
    # The fonts' licences (Apache 2.0 and the OFL ask that a copy go with them; not every font
    # file holds its whole): shipped, and in the app's LicenseRegistry. The score's are the
    # engine's (packages/score_engine/assets/fonts).
    - assets/fonts/CarbonIcons-LICENSE.txt
    - assets/fonts/MaterialSymbols-LICENSE.txt
    - assets/fonts/IBMPlexSans-OFL.txt
  fonts:
    # Carbon's typeface, IBM Plex Sans 1.1.0 (SIL OFL 1.1, see assets/fonts/IBMPlexSans-OFL.txt):
    # the weights the Carbon style sets (Light, Regular, SemiBold).
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    # The icons (AppIcon), one font per style, made by Tools/make_icon_fonts.py from Material Symbols
    # Rounded and IBM's Carbon icons (both Apache 2.0, see assets/fonts/*-LICENSE.txt).
    - family: Material Symbols Rounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
    - family: Carbon Icons
      fonts:
        - asset: assets/fonts/CarbonIcons.ttf
