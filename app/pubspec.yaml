name: curated_score
description: "Curator: animated score videos, curated instrument by instrument."
publish_to: 'none'
version: 0.3.0+23

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  score_engine:
    path: ../packages/score_engine
  archive: ^4.3.0 # .ccs projects are zip archives
  desktop_drop: ^0.8.4 # drop a project, score or recording on the window
  file_selector: ^1.1.0 # Open…, Save As…, Add Recording…
  flutter_soloud: ^5.1.2 # playback; its position is the master clock
  shared_preferences: ^2.5.5 # Settings and Open Recent
  flutter_svg: ^2.3.0
  vector_graphics_compiler: ^1.1.0 # what an SVG with no size of its own draws (Attach Image)
  pasteboard: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test: # the smoke test of the built app (integration_test/, `make smoke`)
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/ # the sample project behind "Try the sample" (and every test)
    - assets/icon/ # the app icon, at the top of Settings ▸ About (a copy of the macOS one)
